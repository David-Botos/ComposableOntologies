<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="rgba(233,226,205,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0c0d0c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- corner brackets -->
  <g stroke="#8fe6a4" stroke-width="3" fill="none">
    <path d="M60 70 H100 M60 70 V110"/>
    <path d="M1140 560 H1100 M1140 560 V520"/>
  </g>

  <text x="80" y="220" font-family="'JetBrains Mono', monospace" font-size="34" fill="#8fe6a4" letter-spacing="4">&gt; COMPOSABLE ONTOLOGIES</text>
  <text x="78" y="320" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="78" fill="#f2ecda">Every domain is a</text>
  <text x="78" y="410" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="78" fill="#8fe6a4">unique fingerprint.</text>
  <text x="80" y="500" font-family="'JetBrains Mono', monospace" font-size="27" fill="#cbc6b6">The composable data layer for cross-domain AI.</text>

  <!-- mini graph, right -->
  <g transform="translate(870,120)" stroke="rgba(233,226,205,0.35)" stroke-width="1.2">
    <line x1="120" y1="20" x2="40" y2="130"/><line x1="120" y1="20" x2="210" y2="120"/>
    <line x1="40" y1="130" x2="130" y2="230"/><line x1="210" y1="120" x2="130" y2="230"/>
    <line x1="120" y1="20" x2="130" y2="230"/><line x1="40" y1="130" x2="210" y2="120"/>
  </g>
  <g transform="translate(870,120)" fill="#f2ecda">
    <circle cx="120" cy="20" r="7"/><circle cx="40" cy="130" r="6"/>
    <circle cx="210" cy="120" r="6"/><circle cx="130" cy="230" r="7"/>
  </g>
  <circle cx="990" cy="240" r="6" fill="#8fe6a4"/>
</svg>
